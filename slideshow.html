<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="dropzone">
  <div class="icon">🖼️</div>
  <h1>Slideshow</h1>
  <p>Drop images or folders here, or click to browse</p>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="folderInput.click()">📁 Folder</button>
    <button class="btn btn-secondary" onclick="photosInput.click()">🖼️ Photos</button>
  </div>
  <input type="file" id="folderInput" webkitdirectory directory multiple onchange="handleFiles(this.files)">
  <input type="file" id="photosInput" multiple accept="image/*" onchange="handleFiles(this.files)">
</div>

<div id="stage" style="display:none;">
  <div id="stage-content">
    <img id="main-img" src="" alt="" style="position:absolute;opacity:1;transition:opacity 0.5s ease;">
    <img id="offscreen-img" src="" alt="" style="position:absolute;opacity:0;transition:opacity 0.5s ease;">
  </div>
  <div id="progress-bar"></div>
  <div id="img-info">--</div>
</div>

<div id="filmstrip-wrap" style="display:none;"><div id="filmstrip"></div></div>

<div id="top-hud" class="hidden">
  <div id="counter">0 / 0</div>
  <div id="add-more-wrap">
    <button id="add-more-btn" onclick="addMoreInput.click()">+ Add Folder</button>
    <button id="add-photos-btn" onclick="addPhotosInput.click()">+ Add Photos</button>
  </div>
  <div id="top-right">
    <button class="hud-btn" id="btn-shuffle" title="Shuffle (S)">🔀</button>
    <button class="hud-btn" id="btn-airplay" title="AirPlay">📡</button>
    <button class="hud-btn" id="btn-present" title="Open Display (P)">📺</button>
    <button class="hud-btn hud-btn-kiosk" id="btn-kiosk" title="Kiosk Mode (K)">🖥️ Kiosk</button>
    <button class="hud-btn" id="btn-fullscreen" title="Fullscreen (F)">⛶</button>
  </div>
</div>

<input type="file" id="addMoreInput" webkitdirectory directory multiple onchange="handleFiles(this.files)" style="display:none;">
<input type="file" id="addPhotosInput" multiple accept="image/*" onchange="handleFiles(this.files)" style="display:none;">

<div id="controls" class="hidden">
  <div class="controls-row">
    <button class="ctrl-btn" id="btn-prev-control" title="Previous">◀</button>
    <button class="ctrl-btn large" id="btn-play-control" title="Play/Pause">⏸</button>
    <button class="ctrl-btn" id="btn-next-control" title="Next">▶</button>
  </div>
  <div class="settings-row">
    <div class="setting-group">
      <label>Timing</label>
      <input type="range" id="timing-control" min="1" max="60" value="5">
      <span id="timing-val-control">5s</span>
    </div>
    <div class="setting-group">
      <label>Transition</label>
      <select id="transition-control">
        <option value="fade">Fade</option>
        <option value="slide">Slide</option>
        <option value="none">None</option>
      </select>
    </div>
  </div>
</div>

<script>
let images = [], currentIndex = 0, isPlaying = false, isShuffled = false;
let playInterval = null, timing = 5, transition = 'fade';
let displayWindow = null, displayReady = false, channel = null;
let originalOrder = [], isPresentMode = false;

const dropzone = document.getElementById('dropzone');
const stage = document.getElementById('stage');
const mainImg = document.getElementById('main-img');
const offscreenImg = document.getElementById('offscreen-img');
const filmstripWrap = document.getElementById('filmstrip-wrap');
const filmstrip = document.getElementById('filmstrip');
const topHud = document.getElementById('top-hud');
const controls = document.getElementById('controls');
const counter = document.getElementById('counter');
const progressBar = document.getElementById('progress-bar');
const imgInfo = document.getElementById('img-info');
const displayStatus = document.getElementById('display-status');
const btnPresent = document.getElementById('btn-present');
const btnKiosk = document.getElementById('btn-kiosk');
const btnPlay = document.getElementById('btn-play-control');
const btnShuffle = document.getElementById('btn-shuffle');
const btnFullscreen = document.getElementById('btn-fullscreen');
const btnAirplay = document.getElementById('btn-airplay');

// Setup BroadcastChannel to talk to display window
try {
  channel = new BroadcastChannel('slideshow');
  channel.onmessage = ({data}) => {
    if (data.cmd === 'ready') {
      displayReady = true;
      updateDisplayStatus();
      syncToDisplay();
    }
  };
} catch(e) {
  console.log('BroadcastChannel not supported');
}

// File handling
dropzone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropzone.classList.add('drag-over');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('drag-over');
});

dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  if (files.length) handleFiles(files);
});

function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  
  files.forEach(file => {
    images.push({
      url: URL.createObjectURL(file),
      name: file.name
    });
  });
  
  originalOrder = [...images];
  
  if (images.length === files.length) {
    // First batch
    dropzone.style.display = 'none';
    stage.style.display = 'block';
    filmstripWrap.style.display = 'block';
    topHud.classList.remove('hidden');
    controls.classList.remove('hidden');
    controls.classList.add('show');
    showImage(0);
  }
  updateFilmstrip();
  updateCounter();
}

function showImage(index) {
  if (!images.length) return;
  currentIndex = (index + images.length) % images.length;
  mainImg.src = images[currentIndex].url;
  imgInfo.textContent = images[currentIndex].name;
  imgInfo.classList.add('show');
  updateCounter();
  updateProgress();
  updateFilmstrip();
  syncToDisplay();
}

function updateFilmstrip() {
  filmstrip.innerHTML = images.map((img, i) => `
    <div class="thumb ${i === currentIndex ? 'active' : ''}" data-index="${i}">
      <img src="${img.url}" alt="">
    </div>
  `).join('');
  
  filmstrip.querySelectorAll('.thumb').forEach(thumb => {
    thumb.onclick = () => showImage(parseInt(thumb.dataset.index));
  });
}

function updateCounter() {
  counter.textContent = images.length ? `${currentIndex + 1} / ${images.length}` : '0 / 0';
}

function updateProgress() {
  progressBar.style.width = images.length ? `${((currentIndex + 1) / images.length * 100)}%` : '0%';
}

function updateDisplayStatus() {
  if (displayReady && displayWindow && !displayWindow.closed) {
    displayStatus.classList.add('visible');
    btnPresent.classList.add('live');
  } else {
    displayStatus.classList.remove('visible');
    btnPresent.classList.remove('live');
    displayReady = false;
  }
}

function syncToDisplay() {
  // Local BroadcastChannel display
  if (channel && displayReady && images.length > 0) {
    channel.postMessage({
      cmd: 'show',
      url: images[currentIndex].url,
      transition: transition
    });
  }
  
  // Remote WebSocket displays
  if (window.RemoteDisplay && window.RemoteDisplay.isConnected && images.length > 0) {
    window.RemoteDisplay.sync(images[currentIndex].url, transition);
  }
}

function openKioskWindow() {
  // Open clean fullscreen window - no browser chrome at all
  const w = screen.width || window.innerWidth;
  const h = screen.height || window.innerHeight;
  const features = `width=${w},height=${h},menubar=no,toolbar=no,location=no,status=no,scrollbars=no,resizable=yes`;
  const kioskWindow = window.open("display.html", "kiosk", features);
  
  if (!kioskWindow || kioskWindow.closed) {
    alert("Popup blocked. Please allow popups and try again.");
    return;
  }
  
  // Try to make it fullscreen
  setTimeout(() => {
    kioskWindow.document.documentElement.requestFullscreen?.().catch(() => {});
    // Lock cursor to hide it
    kioskWindow.document.body.style.cursor = 'none';
  }, 300);
  
  // Focus and monitor
  kioskWindow.focus();
  const checkInterval = setInterval(() => {
    if (!kioskWindow || kioskWindow.closed) {
      clearInterval(checkInterval);
    }
  }, 1000);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
}

function tryAirPlay() {
  // iOS: Show alert about using Control Center
  alert("To AirPlay to TV:\n\n1. Open Control Center\n2. Tap Screen Mirroring\n3. Select your TV\n\nThe clean display will show on your TV.");
}

function openRemoteDisplay() {
  // Use RemoteDisplay module if available
  if (window.RemoteDisplay) {
    const code = window.RemoteDisplay.connect();
    showRemotePanel(code);
  } else {
    // Fallback: simple alert with instructions
    const code = Math.random().toString(36).substring(2, 6).toUpperCase();
    const url = `${window.location.origin}/display.html?join=${code}`;
    alert(`📺 Open on TV\n\n1. Open this URL on your TV/browser:\n${url}\n\n2. Or enter code: ${code}\n\n(Remote display module not loaded)`);
  }
}

function showRemotePanel(code) {
  // Create or update remote panel
  let panel = document.getElementById('remote-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'remote-panel';
    panel.style.cssText = `
      position: fixed;
      top: 80px;
      right: 20px;
      background: rgba(0,0,0,0.9);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      z-index: 1000;
      min-width: 220px;
      text-align: center;
    `;
    document.body.appendChild(panel);
  }
  
  const url = `${window.location.origin}/display.html?join=${code}`;
  
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <span style="font-weight:600;">📺 Remote Display</span>
      <button onclick="this.parentElement.parentElement.remove()" style="background:none;border:none;color:#888;cursor:pointer;font-size:18px;">×</button>
    </div>
    <div style="margin-bottom:12px;">
      <div style="color:#888;font-size:12px;margin-bottom:4px;">Session Code</div>
      <div style="font-size:36px;font-weight:300;letter-spacing:8px;color:#0af;">${code}</div>
    </div>
    <div style="margin-bottom:12px;font-size:12px;color:#888;">
      Open on your TV:<br>
      <code style="background:#222;padding:4px 8px;border-radius:4px;display:inline-block;margin-top:4px;word-break:break-all;">${url}</code>
    </div>
    <div id="remote-display-count" style="color:#4f4;font-size:12px;display:none;"></div>
  `;
  
  panel.style.display = 'block';
  
  // Listen for display connections
  window.addEventListener('remotedisplayjoined', (e) => {
    const countEl = document.getElementById('remote-display-count');
    if (countEl) {
      countEl.style.display = 'block';
      countEl.textContent = `${e.detail.count} display${e.detail.count !== 1 ? 's' : ''} connected`;
    }
  });
}

// Button event listeners
btnPresent.addEventListener('click', openDisplayWindow);
btnKiosk.addEventListener('click', openKioskWindow);
btnAirplay.addEventListener('click', openRemoteDisplay);  // New: Open on TV via WebSocket
btnPlay.addEventListener('click', togglePlay);
btnShuffle.addEventListener('click', () => {
  isShuffled = !isShuffled;
  btnShuffle.classList.toggle('active', isShuffled);
  if (isShuffled) {
    // Shuffle
    for (let i = images.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [images[i], images[j]] = [images[j], images[i]];
    }
  } else {
    // Restore original order
    images = [...originalOrder];
  }
  showImage(0);
});
btnFullscreen.addEventListener('click', toggleFullscreen);
btnAirplay.addEventListener('click', tryAirPlay);
btnPrev.addEventListener('click', () => { showImage(currentIndex - 1); });
btnNext.addEventListener('click', () => { showImage(currentIndex + 1); });

// Input change handlers
const folderInput = document.getElementById('folderInput');
const photosInput = document.getElementById('photosInput');
const addMoreInput = document.getElementById('addMoreInput');
const addPhotosInput = document.getElementById('addPhotosInput');
const timingInput = document.getElementById('timing');
const transitionSelect = document.getElementById('transition');

folderInput.addEventListener('change', (e) => handleFiles(e.target.files));
photosInput.addEventListener('change', (e) => handleFiles(e.target.files));
addMoreInput.addEventListener('change', (e) => handleFiles(e.target.files));
addPhotosInput.addEventListener('change', (e) => handleFiles(e.target.files));

timingInput.addEventListener('input', () => {
  timing = parseInt(timingInput.value);
  document.getElementById('timing-val').textContent = timing + 's';
});

transitionSelect.addEventListener('change', () => {
  transition = transitionSelect.value;
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  
  switch(e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowRight':
      showImage(currentIndex + 1);
      break;
    case 'ArrowLeft':
      showImage(currentIndex - 1);
      break;
    case 'f':
    case 'F':
      toggleFullscreen();
      break;
    case 's':
    case 'S':
      btnShuffle.click();
      break;
    case 'p':
    case 'P':
      openDisplayWindow();
      break;
    case 'k':
    case 'K':
      openKioskWindow();
      break;
    case 'Escape':
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
      break;
  }
});

// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
<script src="remote-display.js"></script>
</body>
</html>
