<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Slideshow</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow: hidden;
  height: 100vh; width: 100vw;
  user-select: none;
}

/* ── Drop zone ── */
#dropzone {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 24px; background: #0a0a0a; z-index: 100;
  transition: background 0.2s;
}
#dropzone.drag-over { background: #111820; }
#dropzone h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; }
#dropzone p  { color: #666; font-size: 1rem; text-align: center; max-width: 360px; line-height: 1.5; }
#dropzone .icon { font-size: 4rem; opacity: 0.4; }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px; border: none; border-radius: 10px;
  font-size: 0.95rem; font-weight: 600; cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary   { background: #fff; color: #000; }
.btn-secondary { background: #1e1e1e; color: #fff; border: 1px solid #333; }
.btn:hover { opacity: 0.85; }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
#folderInput, #photosInput, #addMoreInput, #addPhotosInput { display: none; }

/* ── Stage ── */
#stage { position: fixed; inset: 0; background: #000; display: none; }

.slide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: none;
}
.slide.active { opacity: 1; }
.slide.fade-in        { animation: fadeIn var(--dur,0.7s) ease forwards; }
.slide.fade-out       { animation: fadeOut var(--dur,0.7s) ease forwards; }
.slide.slide-in-left  { animation: slideInLeft var(--dur,0.5s) ease forwards; }
.slide.slide-out-left { animation: slideOutLeft var(--dur,0.5s) ease forwards; }

@keyframes fadeIn       { from{opacity:0} to{opacity:1} }
@keyframes fadeOut      { from{opacity:1} to{opacity:0} }
@keyframes slideInLeft  { from{transform:translateX(100%)} to{transform:translateX(0)} }
@keyframes slideOutLeft { from{transform:translateX(0)} to{transform:translateX(-100%)} }

.slide img {
  max-width:100%; max-height:100%;
  width:100%; height:100%;
  object-fit:contain; display:block;
}

/* ── Progress bar ── */
#progress-bar {
  position: fixed; top: 0; left: 0; height: 3px;
  background: rgba(255,255,255,0.85); width: 0%; z-index: 50;
  transition: width 0.3s linear;
  box-shadow: 0 0 6px rgba(255,255,255,0.5);
}

/* ── Image info ── */
#img-info {
  position: fixed; bottom: 172px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-radius: 8px; padding: 6px 14px;
  font-size: 0.78rem; color: rgba(255,255,255,0.7);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 80vw; text-align: center; pointer-events: none; z-index: 40;
  transition: opacity 0.4s;
}
#img-info.hidden { opacity: 0; }

/* ── Filmstrip ── */
#filmstrip-wrap {
  position: fixed; bottom: 100px; left: 0; right: 0;
  height: 72px; z-index: 48;
  transition: opacity 0.4s, transform 0.4s;
  overflow: hidden;
}
#filmstrip-wrap.hidden { opacity: 0; pointer-events: none; transform: translateY(10px); }
#filmstrip {
  display: flex; align-items: center; gap: 6px;
  height: 100%; padding: 0 16px;
  overflow-x: auto; overflow-y: hidden;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#filmstrip::-webkit-scrollbar { display: none; }
.thumb {
  flex-shrink: 0; width: 60px; height: 60px;
  border-radius: 6px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.2s, transform 0.15s, opacity 0.2s;
  opacity: 0.55;
  background: #111;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.active { border-color: #fff; opacity: 1; transform: scale(1.1); }
.thumb:hover { opacity: 0.85; }

/* ── Controls ── */
#controls {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 8px 20px 24px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  display: flex; flex-direction: column; gap: 10px;
  z-index: 50; transition: opacity 0.4s ease;
}
#controls.hidden { opacity: 0; pointer-events: none; }

.controls-row {
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.ctrl-btn {
  background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; font-size: 1.2rem;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: background 0.15s, transform 0.1s;
}
.ctrl-btn:hover  { background: rgba(255,255,255,0.22); }
.ctrl-btn:active { transform: scale(0.93); }
.ctrl-btn.active { background: rgba(255,255,255,0.3); }
.ctrl-btn.large  { width: 58px; height: 58px; font-size: 1.5rem; }

.settings-row {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; flex-wrap: wrap;
}
.setting-group {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.08); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); border-radius: 20px; padding: 6px 14px;
}
.setting-group label { font-size: 0.75rem; color: rgba(255,255,255,0.65); white-space: nowrap; }
.setting-group input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 90px; height: 4px;
  background: rgba(255,255,255,0.3); border-radius: 2px; outline: none;
}
.setting-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; cursor: pointer;
}
.setting-group select {
  background: transparent; border: none; color: #fff;
  font-size: 0.8rem; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none;
}
.setting-group select option { background: #111; color: #fff; }
#timing-val { font-size: 0.8rem; color: #fff; min-width: 28px; }

/* ── Top HUD ── */
#top-hud {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 16px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 51; transition: opacity 0.4s;
  pointer-events: none;
}
#top-hud.hidden { opacity: 0; }
#top-hud > * { pointer-events: all; }

#counter {
  background: rgba(0,0,0,0.45); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); border-radius: 20px; padding: 4px 12px;
  font-size: 0.75rem; color: rgba(255,255,255,0.6);
}

/* top-center add buttons */
#add-more-wrap {
  display: flex; gap: 8px; position: absolute;
  left: 50%; transform: translateX(-50%);
}
#add-more-btn, #add-photos-btn {
  background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px); border: none; border-radius: 20px;
  padding: 6px 14px; color: rgba(255,255,255,0.7);
  font-size: 0.8rem; cursor: pointer; transition: background 0.15s;
}
#add-more-btn:hover, #add-photos-btn:hover { background: rgba(255,255,255,0.2); }

/* top-right cluster */
#top-right { display: flex; gap: 8px; }
.hud-btn {
  background: rgba(255,255,255,0.12); border: none; border-radius: 50%;
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #fff; font-size: 1rem;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: background 0.15s;
}
.hud-btn:hover { background: rgba(255,255,255,0.22); }
.hud-btn.active { background: rgba(255,255,255,0.3); }

/* ── Present mode ── */
body.present-mode #controls     { opacity: 0 !important; pointer-events: none !important; }
body.present-mode #top-hud      { opacity: 0 !important; pointer-events: none !important; }
body.present-mode #filmstrip-wrap{ opacity: 0 !important; pointer-events: none !important; }
body.present-mode #img-info     { opacity: 0 !important; }
body.present-mode #progress-bar { opacity: 0; }
/* tap anywhere to briefly show controls in present mode */
body.present-mode.present-peek #top-hud { opacity: 1 !important; pointer-events: all !important; }

/* AirPlay video anchor (hidden, just for picker) */
#airplay-video { display: none; }
</style>
</head>
<body>

<!-- ══ LANDING ══ -->
<div id="dropzone">
  <div class="icon">🖼️</div>
  <h1>Slideshow</h1>
  <p>Browse your Photos library, choose folders, or drag &amp; drop.</p>
  <div class="btn-row">
    <button class="btn btn-primary"   onclick="document.getElementById('photosInput').click()">🌄 Photos Library</button>
    <button class="btn btn-secondary" onclick="document.getElementById('folderInput').click()">📁 Choose Folders</button>
  </div>
  <p style="font-size:0.75rem;color:#444;">JPG · PNG · GIF · WebP · HEIC · AVIF · TIFF · BMP · SVG</p>
  <input type="file" id="photosInput" multiple accept="image/*,.heic,.heif,.avif">
  <input type="file" id="folderInput" webkitdirectory multiple accept="image/*,.heic,.heif,.avif,.tiff,.tif">
</div>

<!-- ══ STAGE ══ -->
<div id="stage">
  <div id="slide-a" class="slide"></div>
  <div id="slide-b" class="slide"></div>
</div>
<video id="airplay-video" src="" x-webkit-airplay="allow" webkit-playsinline playsinline></video>

<!-- ══ PROGRESS ══ -->
<div id="progress-bar"></div>

<!-- ══ IMAGE INFO ══ -->
<div id="img-info"></div>

<!-- ══ FILMSTRIP ══ -->
<div id="filmstrip-wrap">
  <div id="filmstrip"></div>
</div>

<!-- ══ TOP HUD ══ -->
<div id="top-hud">
  <div id="counter">1 / 1</div>
  <div id="add-more-wrap">
    <button id="add-more-btn"    onclick="document.getElementById('addMoreInput').click()">+ Folders</button>
    <button id="add-photos-btn"  onclick="document.getElementById('addPhotosInput').click()">+ Photos</button>
  </div>
  <div id="top-right">
    <button class="hud-btn" id="btn-airplay" title="AirPlay / Cast">📡</button>
    <button class="hud-btn" id="btn-present" title="Present mode (P)">▶︎</button>
    <button class="hud-btn" id="fs-btn"      title="Fullscreen (F)">⛶</button>
  </div>
</div>
<input type="file" id="addMoreInput"   webkitdirectory multiple accept="image/*,.heic,.heif,.avif,.tiff,.tif">
<input type="file" id="addPhotosInput" multiple accept="image/*,.heic,.heif,.avif">

<!-- ══ CONTROLS ══ -->
<div id="controls">
  <div class="settings-row">
    <div class="setting-group">
      <label>Speed</label>
      <input type="range" id="timing" min="1" max="30" value="5" step="1">
      <span id="timing-val">5s</span>
    </div>
    <div class="setting-group">
      <label>Transition</label>
      <select id="transition">
        <option value="fade">Fade</option>
        <option value="slide">Slide</option>
        <option value="none">None</option>
      </select>
    </div>
  </div>
  <div class="controls-row">
    <button class="ctrl-btn" id="btn-shuffle"  title="Shuffle (S)">🔀</button>
    <button class="ctrl-btn" id="btn-prev"     title="Prev (←)">◀</button>
    <button class="ctrl-btn large" id="btn-play" title="Play/Pause (Space)">⏸</button>
    <button class="ctrl-btn" id="btn-next"     title="Next (→)">▶</button>
    <button class="ctrl-btn" id="btn-restart"  title="Restart">↩</button>
  </div>
</div>

<script>
const SUPPORTED = /\.(jpe?g|png|gif|webp|heic|heif|avif|tiff?|bmp|svg)$/i;
let images = [], idx = 0, playing = true, shuffled = false;
let timer = null, hideTimer = null, controlsVisible = true;
let presentMode = false, peekTimer = null;
let currentSlot = 'a';

// DOM
const dropzone      = document.getElementById('dropzone');
const stage         = document.getElementById('stage');
const slideA        = document.getElementById('slide-a');
const slideB        = document.getElementById('slide-b');
const progressBar   = document.getElementById('progress-bar');
const imgInfo       = document.getElementById('img-info');
const filmstripWrap = document.getElementById('filmstrip-wrap');
const filmstrip     = document.getElementById('filmstrip');
const topHud        = document.getElementById('top-hud');
const counter       = document.getElementById('counter');
const addMoreWrap   = document.getElementById('add-more-wrap');
const controls      = document.getElementById('controls');
const btnPlay       = document.getElementById('btn-play');
const btnPrev       = document.getElementById('btn-prev');
const btnNext       = document.getElementById('btn-next');
const btnShuffle    = document.getElementById('btn-shuffle');
const btnRestart    = document.getElementById('btn-restart');
const btnAirplay    = document.getElementById('btn-airplay');
const btnPresent    = document.getElementById('btn-present');
const fsBtn         = document.getElementById('fs-btn');
const timingSlider  = document.getElementById('timing');
const timingVal     = document.getElementById('timing-val');
const transSelect   = document.getElementById('transition');
const airplayVideo  = document.getElementById('airplay-video');

// Inputs
['folderInput','photosInput','addMoreInput','addPhotosInput'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => loadFiles(e.target.files));
});

// ── File loading ──
function loadFiles(fileList) {
  const newImgs = [];
  for (const f of fileList) {
    if (!SUPPORTED.test(f.name)) continue;
    const parts = f.webkitRelativePath ? f.webkitRelativePath.split('/') : [f.name];
    const folder = parts.length > 1 ? parts[parts.length - 2] : '—';
    newImgs.push({ file: f, name: f.name, folder, url: null, thumb: null });
  }
  if (!newImgs.length) return;
  images = images.concat(newImgs);
  if (shuffled) shuffleArr(images);
  buildFilmstrip();
  startShow();
}

// ── Drag & drop ──
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag-over');
  const items = e.dataTransfer.items, files = [];
  let pending = 0;
  const tryStart = () => { if (!pending) loadFiles(files); };
  for (const item of items) {
    const entry = item.webkitGetAsEntry?.();
    if (entry?.isDirectory) { pending++; readDir(entry, files, () => { pending--; tryStart(); }); }
    else if (item.kind === 'file') { const f = item.getAsFile(); if (f) files.push(f); }
  }
  tryStart();
});

function readDir(dir, out, done) {
  const reader = dir.createReader(); let all = [];
  const read = () => reader.readEntries(batch => {
    if (!batch.length) { process(); return; }
    all = all.concat([...batch]); read();
  });
  read();
  function process() {
    if (!all.length) { done(); return; }
    let p = all.length;
    all.forEach(e => {
      if (e.isFile)      e.file(f => { out.push(f); if (!--p) done(); });
      else if (e.isDirectory) readDir(e, out, () => { if (!--p) done(); });
      else if (!--p) done();
    });
  }
}

// ── Filmstrip ──
function buildFilmstrip() {
  filmstrip.innerHTML = '';
  images.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'thumb' + (i === idx ? ' active' : '');
    div.dataset.idx = i;
    const el = document.createElement('img');
    el.alt = img.name;
    // lazy-load thumb
    getUrl(i, url => { el.src = url; });
    div.appendChild(el);
    div.addEventListener('click', () => {
      clearTimeout(timer);
      loadAndShow(i, 1);
      if (playing) scheduleNext();
    });
    filmstrip.appendChild(div);
  });
}

function updateFilmstrip() {
  const thumbs = filmstrip.querySelectorAll('.thumb');
  thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
  // scroll active thumb into view
  if (thumbs[idx]) {
    thumbs[idx].scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  }
}

// ── Show ──
function startShow() {
  dropzone.style.display = 'none';
  stage.style.display = 'block';
  if (images.length === 1 || idx >= images.length) idx = 0;
  loadAndShow(idx, 1);
  if (playing) scheduleNext();
}

function getSlide(s)  { return s === 'a' ? slideA : slideB; }
function otherSlot(s) { return s === 'a' ? 'b' : 'a'; }

function getUrl(i, cb) {
  if (images[i].url) { cb(images[i].url); return; }
  const r = new FileReader();
  r.onload = e => { images[i].url = e.target.result; cb(e.target.result); };
  r.readAsDataURL(images[i].file);
}

function loadAndShow(newIdx, dir) {
  if (!images.length) return;
  const img = images[newIdx];
  const transition = transSelect.value;
  getUrl(newIdx, url => {
    const nextSlot  = otherSlot(currentSlot);
    const nextSlide = getSlide(nextSlot);
    const currSlide = getSlide(currentSlot);
    nextSlide.innerHTML = '';
    const el = document.createElement('img');
    el.src = url; el.alt = img.name;
    nextSlide.appendChild(el);

    const dur = transition === 'none' ? 0 : transition === 'fade' ? 700 : 500;
    document.documentElement.style.setProperty('--dur', dur + 'ms');

    if (transition === 'fade') {
      currSlide.classList.remove('active');
      nextSlide.classList.add('active','fade-in');
      setTimeout(() => { currSlide.innerHTML=''; nextSlide.classList.remove('fade-in'); currentSlot=nextSlot; }, dur);
    } else if (transition === 'slide') {
      nextSlide.classList.add('active','slide-in-left');
      currSlide.classList.add('slide-out-left');
      setTimeout(() => { currSlide.classList.remove('active','slide-out-left'); nextSlide.classList.remove('slide-in-left'); currSlide.innerHTML=''; currentSlot=nextSlot; }, dur);
    } else {
      currSlide.classList.remove('active'); currSlide.innerHTML='';
      nextSlide.classList.add('active'); currentSlot = nextSlot;
    }

    // preload next
    const pre = (newIdx+1) % images.length;
    if (pre !== newIdx) getUrl(pre, () => {});

    idx = newIdx;
    updateHUD();
    updateFilmstrip();
  });
}

function updateHUD() {
  const img = images[idx];
  imgInfo.textContent = img ? `${img.folder}  /  ${img.name}` : '';
  counter.textContent = `${idx+1} / ${images.length}`;
  progressBar.style.width = images.length > 1
    ? ((idx / (images.length-1)) * 100) + '%' : '100%';
}

// ── Playback ──
function scheduleNext() {
  clearTimeout(timer);
  timer = setTimeout(() => advance(1), parseInt(timingSlider.value) * 1000);
}
function advance(dir) {
  if (!images.length) return;
  loadAndShow((idx + dir + images.length) % images.length, dir);
  if (playing) scheduleNext();
}
function togglePlay() {
  playing = !playing;
  btnPlay.textContent = playing ? '⏸' : '▶';
  if (playing) scheduleNext(); else clearTimeout(timer);
}

btnPlay.addEventListener('click', togglePlay);
btnPrev.addEventListener('click', () => { clearTimeout(timer); advance(-1); });
btnNext.addEventListener('click', () => { clearTimeout(timer); advance(1); });
btnRestart.addEventListener('click', () => { clearTimeout(timer); loadAndShow(0,1); if(playing) scheduleNext(); });
btnShuffle.addEventListener('click', () => {
  shuffled = !shuffled;
  btnShuffle.classList.toggle('active', shuffled);
  if (shuffled) shuffleArr(images);
  else images.sort((a,b) => a.folder.localeCompare(b.folder) || a.name.localeCompare(b.name));
  buildFilmstrip(); loadAndShow(0,1); if(playing) scheduleNext();
});
timingSlider.addEventListener('input', () => {
  timingVal.textContent = timingSlider.value + 's';
  if (playing) { clearTimeout(timer); scheduleNext(); }
});

function shuffleArr(arr) {
  for (let i=arr.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

// ── Fullscreen ──
fsBtn.addEventListener('click', toggleFS);
function toggleFS() {
  const el = document.documentElement;
  if (!document.fullscreenElement && !document.webkitFullscreenElement)
    (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  else
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
function updateFsBtn() {
  fsBtn.textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '⊠' : '⛶';
}
document.addEventListener('fullscreenchange', updateFsBtn);
document.addEventListener('webkitfullscreenchange', updateFsBtn);

// ── AirPlay ──
btnAirplay.addEventListener('click', () => {
  // Try native AirPlay picker on WebKit
  if (airplayVideo.webkitShowPlaybackTargetPicker) {
    airplayVideo.webkitShowPlaybackTargetPicker();
  } else {
    // Fallback: go fullscreen (best we can do on non-WebKit)
    toggleFS();
  }
});
if (window.WebKitPlaybackTargetAvailabilityEvent) {
  airplayVideo.addEventListener('webkitplaybacktargetavailabilitychanged', e => {
    btnAirplay.classList.toggle('active', e.availability === 'available');
  });
}

// ── Present mode ──
btnPresent.addEventListener('click', togglePresent);
function togglePresent() {
  presentMode = !presentMode;
  document.body.classList.toggle('present-mode', presentMode);
  btnPresent.classList.toggle('active', presentMode);
  btnPresent.title = presentMode ? 'Exit Present Mode (P)' : 'Present Mode (P)';
  if (presentMode) {
    // also go fullscreen
    const el = document.documentElement;
    if (!document.fullscreenElement && !document.webkitFullscreenElement)
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el).catch(()=>{});
  }
}

// Tap in present mode → brief peek at controls
stage.addEventListener('click', e => {
  if (!presentMode) return;
  if (e.target.closest('#controls') || e.target.closest('#top-hud')) return;
  document.body.classList.add('present-peek');
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => document.body.classList.remove('present-peek'), 2500);
});

// ── Auto-hide controls ──
const hudEls = [controls, topHud, filmstripWrap, imgInfo];
function showControls() {
  if (presentMode) return;
  hudEls.forEach(el => el.classList.remove('hidden'));
  controlsVisible = true;
  clearTimeout(hideTimer);
  if (images.length) hideTimer = setTimeout(hideControls, 3000);
}
function hideControls() {
  hudEls.forEach(el => el.classList.add('hidden'));
  controlsVisible = false;
}

document.addEventListener('mousemove', showControls);
document.addEventListener('touchstart', showControls, { passive: true });
document.addEventListener('click', e => {
  if (!controlsVisible && !presentMode && !e.target.closest('#dropzone')) showControls();
});

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch(e.key) {
    case ' ':         e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': clearTimeout(timer); advance(-1); break;
    case 'ArrowRight':clearTimeout(timer); advance(1); break;
    case 'f': case 'F': toggleFS(); break;
    case 's': case 'S': btnShuffle.click(); break;
    case 'p': case 'P': togglePresent(); break;
    case 'Escape':
      if (presentMode) { togglePresent(); }
      else if (document.fullscreenElement || document.webkitFullscreenElement)
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      break;
  }
});

// ── Service Worker ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
