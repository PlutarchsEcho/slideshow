<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Slideshow Display</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }
#slide { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
#slide img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<div id="slide"><img id="img" src="" alt=""></div>
<script>
const bc = new BroadcastChannel('slideshow');
const img = document.getElementById('img');

// Auto fullscreen immediately
document.documentElement.requestFullscreen?.().catch(() => {});

bc.onmessage = ({data}) => {
  if (data.cmd === 'show' && data.url) {
    img.src = data.url;
  }
  if (data.cmd === 'close') {
    window.close();
  }
};

// Tell controller we're ready
bc.postMessage({cmd: 'ready'});

// Ping every 3 seconds so controller knows we're alive
setInterval(() => bc.postMessage({cmd: 'ping'}), 3000);
</script>
</body>
</html>
